{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
  <div class="card mx-auto" style="max-width: 40rem;">
    <div class="card-body">
      <h1 class="h3 card-title">Edit your profile</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Save changes</button>
      </form>
    </div>
  </div>
{% endblock %}
