{% extends 'base.html' %}

{% block content %}
  <div class="card mx-auto" style="max-width: 32rem;">
    <div class="card-body">
      <h1 class="h3 card-title">Log in</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Log in</button>
      </form>
      <p class="mt-3 mb-0">No account? <a href="{% url 'signup' %}">Sign up</a></p>
    </div>
  </div>
{% endblock %}
